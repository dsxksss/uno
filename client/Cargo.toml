[package]
name = "kpi-client"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
crossbeam-channel = "0.5"
futures-util = "0.3"
url = "2"

# Fast compile for dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
